kind = "web"
previewPath = "/"
title = "NUTTER-XMD"
description = "The NUTTER-XMD WhatsApp multi-device bot app, including account pairing, session ID retrieval, fork verification, and deployment guidance."
version = "1.0.0"
id = "artifacts/nutter-xmd"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 19623

[services.development]
run = "pnpm --filter @workspace/nutter-xmd run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/nutter-xmd", "run", "build" ]
serve = "static"
publicDir = "artifacts/nutter-xmd/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "19623"
BASE_PATH = "/"
